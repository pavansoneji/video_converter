name: Build executables

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name VideoConverter main.py

      - name: Fetch FFmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $bin = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Split-Path
          Copy-Item "$bin\ffmpeg.exe" dist\
          Copy-Item "$bin\ffprobe.exe" dist\

      - uses: actions/upload-artifact@v4
        with:
          name: VideoConverter-windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build app
        run: pyinstaller --onefile --windowed --name VideoConverter main.py

      - name: Bundle FFmpeg
        run: |
          brew install ffmpeg
          cp "$(command -v ffmpeg)" dist/
          cp "$(command -v ffprobe)" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: VideoConverter-macos
          path: dist/
